specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NonfungiblePositionManager
    network: mainnet
    source:
      address: "0xC36442b4a4522E871399CD717aBDD847Ab11FE88"
      abi: NonfungiblePositionManager
      startBlock: 19000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - Position
        - PositionEvent
      abis:
        - name: NonfungiblePositionManager
          file: ./abis/NonfungiblePositionManager.json
        - name: UniswapV3Factory
          file: ./abis/UniswapV3Factory.json
      eventHandlers:
        - event: DecreaseLiquidity(indexed uint256,uint128,uint256,uint256)
          handler: handleDecreaseLiquidity
        - event: IncreaseLiquidity(indexed uint256,uint128,uint256,uint256)
          handler: handleIncreaseLiquidity
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/nonfungible-position-manager.ts
  # Pool 1: BitUSD/mTBILL 0.3%
  - kind: ethereum
    name: BitUSDmTBILLPool
    network: mainnet
    source:
      address: "0x3416cF6C708Da44DB2624D63ea0AAef7113527C6"  # Replace with actual pool address
      abi: UniswapV3Pool
      startBlock: 19000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - BitUSDPurchase
      abis:
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
      file: ./src/pool.ts
  # Pool 2: wstROSE/BitUSD 0.03%
  - kind: ethereum
    name: wstROSEBitUSDPool
    network: mainnet
    source:
      address: "0x5777d92f208679DB4b9778590Fa3CAB3aC9e2168"  # Replace with actual pool address
      abi: UniswapV3Pool
      startBlock: 19000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - BitUSDPurchase
      abis:
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
      file: ./src/pool.ts
  # Pool 3: wROSE/BitUSD 0.03%
  - kind: ethereum
    name: wROSEBitUSDPool
    network: mainnet
    source:
      address: "0x99ac8cA7087fA4A2A1FB6357269965A2014ABc35"  # Replace with actual pool address
      abi: UniswapV3Pool
      startBlock: 19000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - BitUSDPurchase
      abis:
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
