specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NonfungiblePositionManager
    network: oasis-sapphire-mainnet
    source:
      address: "0x2D69C85166B8B84916EF49FF20f287f9Eb6381fe"
      abi: NonfungiblePositionManager
      startBlock: 8171580
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - Position
        - PositionEvent
      abis:
        - name: NonfungiblePositionManager
          file: ./abis/NonfungiblePositionManager.json
        - name: UniswapV3Factory
          file: ./abis/UniswapV3Factory.json
      eventHandlers:
        - event: DecreaseLiquidity(indexed uint256,uint128,uint256,uint256)
          handler: handleDecreaseLiquidity
        - event: IncreaseLiquidity(indexed uint256,uint128,uint256,uint256)
          handler: handleIncreaseLiquidity
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/handlers/nonfungible-position-manager.handler.ts
  # Pool 1: BitUSD/mTBILL 0.3%
  - kind: ethereum
    name: BitUSDmTBILLPool
    network: oasis-sapphire-mainnet
    source:
      address: "0x3416cF6C708Da44DB2624D63ea0AAef7113527C6"  
      abi: UniswapV3Pool
      startBlock: 8171580
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - BitUSDPurchase
      abis:
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
      file: ./src/handlers/pool.handler.ts
  # Pool 2: wstROSE/BitUSD 0.03%
  - kind: ethereum
    name: wstROSEBitUSDPool
    network: oasis-sapphire-mainnet
    source:
      address: "0xeb941037f8aa4ce8680666b8af62dd88b2227da2"  
      abi: UniswapV3Pool
      startBlock: 8171580
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - BitUSDPurchase
      abis:
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
      file: ./src/handlers/pool.handler.ts
  # Pool 3: wROSE/BitUSD 0.03%
  - kind: ethereum
    name: wROSEBitUSDPool
    network: oasis-sapphire-mainnet
    source:
      address: "0x419fe2b60f0ea02051b073b71f2326550d371f94"  
      abi: UniswapV3Pool
      startBlock: 8171580
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - BitUSDPurchase
      abis:
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
      file: ./src/handlers/pool.handler.ts
