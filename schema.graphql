type User @entity(immutable: false) {
  id: Bytes!
  positions: [Position!]! @derivedFrom(field: "owner")
  bitUSDPurchases: [BitUSDPurchase!]! @derivedFrom(field: "user")
  totalBitUSDVolume: BigInt! # Total BitUSD purchased by this user
  lastPurchaseTimestamp: BigInt! # Last time user purchased BitUSD
}

type Position @entity(immutable: false) {
  id: ID!
  pool: Bytes!
  owner: User!
  createdAt: BigInt!
  liquidity: BigInt!
  events: [PositionEvent!]! @derivedFrom(field: "position")
}

type PositionEvent @entity(immutable: true) {
  id: ID!
  position: Position!
  type: PositionEventType!
  txHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  amount: BigInt!
  amount0: BigInt!
  amount1: BigInt!
  sender: Bytes!
  recipient: Bytes
}

type BitUSDPurchase @entity(immutable: true) {
  id: ID!
  pool: Bytes!
  user: User!
  sender: Bytes!
  recipient: Bytes!
  bitUSDAmount: BigInt! # Amount of BitUSD purchased (always positive)
  otherTokenAmount: BigInt! # Amount of other token sold (always positive)
  txHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  logIndex: BigInt!
}

enum PositionEventType {
  MINT
  INCREASE
  DECREASE
  TRANSFER
}
